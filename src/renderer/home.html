<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'" />
    <title>Desktop Companion Home</title>
    <link rel="stylesheet" href="./home.css" />
  </head>
  <body>
    <button id="home" type="button" aria-label="Ir a la plataforma; si el robot descansa encima, despertar y salir.">
      <svg id="platform" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="chassis-shade" x1="0" y1="0" x2="0.15" y2="1">
            <stop offset="0" stop-color="#f5f2ec" />
            <stop offset="0.46" stop-color="#f0ebe3" />
            <stop offset="1" stop-color="#e7e2d9" />
          </linearGradient>
          <linearGradient id="rim-shade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f7f4ee" />
            <stop offset="1" stop-color="#ebe6de" />
          </linearGradient>
          <radialGradient id="glass-shade" cx="0.38" cy="0.22" r="0.85">
            <stop offset="0" stop-color="#2a3330" />
            <stop offset="0.45" stop-color="#0c100e" />
            <stop offset="1" stop-color="#050807" />
          </radialGradient>
          <linearGradient id="glass-reflection" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.55" />
            <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
          </linearGradient>
          <filter id="ring-glow" x="-40%" y="-80%" width="180%" height="260%">
            <feGaussianBlur stdDeviation="1.1" />
          </filter>
        </defs>
        <path id="chassis" fill="url(#chassis-shade)" />
        <ellipse id="deck" fill="url(#rim-shade)" />
        <ellipse id="surface" fill="url(#glass-shade)" />
        <ellipse id="ring" fill="none" stroke="#7dff9a" stroke-width="1.6" filter="url(#ring-glow)" />
        <path d="M28 41 Q44 35 64 38 Q52 39 38 43 Z" fill="url(#glass-reflection)" />
        <path d="M22 40 Q34 33 48 33" fill="none" stroke="#f7f4ee" stroke-opacity="0.55" stroke-width="1.25" stroke-linecap="round" />
        <g class="halo" fill="none" stroke="#d8ffe4" stroke-width="2.2" stroke-linecap="round">
          <ellipse id="halo-ring" />
        </g>
      </svg>
    </button>
    <script type="module" src="./home.ts"></script>
  </body>
</html>
