<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Desktop Companion</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="stage">
      <canvas id="view" aria-label="Companion"></canvas>
      <button id="screen-ask" type="button" hidden aria-label="Ask Qwen about a screen area">
        <span class="ask-face">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <rect x="5" y="5" width="14" height="14" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8" />
          <path d="M5 9h3M5 5v3M19 9V5h-4M19 15v4h-4M9 19H5v-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
        </span>
      </button>
      <button id="chat-trigger" type="button" hidden aria-label="Open chat">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path
            d="M5 6.5h14a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H10l-3.5 3v-3H5a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linejoin="round"
          />
        </svg>
      </button>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
